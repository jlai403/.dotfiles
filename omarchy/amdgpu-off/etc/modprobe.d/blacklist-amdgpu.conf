# T2 hybrid Macs (Navi 14 dGPU): take the AMD GPU fully out of the kernel.
# With no driver bound, the dGPU can never populate the suspend path (its SMU
# firmware fails to resume from s2idle and wedges the kernel) nor expose the
# phantom eDP connector whose HPD assertion makes DRM connector names depend on
# GPU probe order — which once left the internal panel mislabeled and Hyprland
# with zero outputs after a failed resume. Community-established alternative to
# the wiki's vgaswitcheroo `amdgpu-off.service` (t2linux T2-Ubuntu issue #195).
# The `kms`/`modconf` mkinitcpio hooks carry this file into the initramfs, which
# is where the `kms` hook would otherwise autoload amdgpu.
blacklist amdgpu
blacklist amdxcp
