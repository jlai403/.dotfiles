# T2 MacBooks cannot resume from S3 (deep), and s2idle also comes back no-state:
# the T2 bridge loses state, the xHCI controllers die and the internal keyboard/
# trackpad are removed, leaving the lock screen input-dead (and s2idle keeps the
# SoC powered, so the fans run). Hibernate powers the machine fully off (fans
# stop, battery saved) and re-enumerates every device on resume.
# Managed by dotfiles; upstream Omarchy leaves HandleLidSwitch at its default
# (suspend). HandleLidSwitchDocked keeps its default (ignore) so a docked lid
# with an external display does nothing.
[Login]
HandleLidSwitch=hibernate
HandleLidSwitchExternalPower=hibernate
