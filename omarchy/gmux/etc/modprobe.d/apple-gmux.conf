# Route the internal panel of T2 16" MacBook Pros to the Intel iGPU.
# Without this, the AMD dGPU handles the panel: it races i915 at boot (permanent
# black screen) and asserts HPD-without-EDID on wake, which Hyprland brings up as
# a ghost eDP-2 output. Managed by dotfiles; see omacom/omarchy discussion #7855.
# After changing this, rebuild the UKI: sudo mkinitcpio -P (kernel updates do it
# automatically via the stock 90-mkinitcpio-install hook).
options apple_gmux force_igd=y