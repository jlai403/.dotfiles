# Titan Ridge xHCI resume workaround, take 1 (before t2-titanridge's
# remove/rescan hook): keep PCIe port power management on ACPI (compat) so
# port services don't go native — required for the Broadcom wifi card
# (8086:2702, on the same bridge) to survive s2idle; t2linux wiki standard.
# Does NOT fix the xHCI pair's d3cold resume failure (that's the
# t2-titanridge system-sleep hook) but is needed alongside it.
KERNEL_CMDLINE[default]+=" pcie_ports=compat"
