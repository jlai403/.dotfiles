# T2 MacBooks cannot use S3 (deep) sleep: resume returns no-state, xHCI fails to
# reinit, the internal keyboard/trackpad are removed and systemd watchdogs kill
# services. Forcing freeze (s2idle) sidesteps the broken deep path.
# Managed by dotfiles; upstream Omarchy deliberately keeps mem_sleep_default=deep,
# which this overrides at suspend time without touching the kernel cmdline.
[Sleep]
SuspendState=freeze
