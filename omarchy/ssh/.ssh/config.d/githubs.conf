# GitHub / Forgejo host aliases for the 1Password SSH agent (Linux ~/.1password/agent.sock).
# This file is stowed from config.d/*.conf, which config.append includes BEFORE
# config.privated/*.conf — so on Linux these IdentityAgent values override the
# macOS socket in ~/.dotfiles_private/ssh/.ssh/config.privated/jlai.conf.
Host ghjlai
	HostName github.com
	User git
	IdentityAgent ~/.1password/agent.sock
	IdentitiesOnly no

Host ghstellar
	HostName github.com
	User git
	IdentityAgent ~/.1password/agent.sock

Host forgejo
	HostName git.ts.jlai.ca
	Port 443
	User git
	IdentityAgent ~/.1password/agent.sock
	IdentitiesOnly no