# The T2 Mac's internal iBridge Ethernet (05ac:8233, cdc_ncm on the BCE VHCI)
# never gets a DHCP lease, and on s2idle resume NetworkManager retrying it
# correlates with hard hangs. Let the kernel own it; don't manage it.
# Matched by interface name so it can't catch USB-C Ethernet dongles, which
# enumerate on the Thunderbolt buses as enp9s0u*/enx*.
[keyfile]
unmanaged-devices=interface-name:enp4s0f1u1
