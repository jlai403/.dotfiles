# T2 built-in mic: PipeWire filter-chain (gain + compressor + limiter) creating
# a normalized source ("MacBook Pro T2 DSP Mic"), an adaptation of
# lemmyg/t2-apple-audio-dsp (mic branch, MIT). The gain is NOT optional: the
# T2 internal mic is ~40 dB under normal level without DSP (upstream kernel
# can't compensate — see t2linux wiki "Device support / state"). This
# machine's mic signal lives on the AUX0 channel only (aux1 = noise floor,
# aux2 dead — measured against a spoken test), so capture pins AUX0;
# AUX1/AUX2 need no explicit mixer. node.target uses the mapped source name
# as installed here (upstream assumed t2-better-audio's "BuiltinMic" alias).

context.modules = [
  { name = libpipewire-module-filter-chain
    args = {
      audio.format = F32
      audio.rate = 48000
      audio.channels = 1
      audio.position = [MONO]
      node.description = "MacBook Pro T2 DSP Mic"
      media.name = "MacBook Pro T2 DSP Mic"
      filter.graph = {
        nodes = [
          {
            type = ladspa
            name = preamp
            plugin = amp_1181
            label = amp
            control = { "Amps gain (dB)" = 35 }
          }
          {
            type = ladspa
            name = compressor
            plugin = sc4_1882
            label = sc4
            control = {
              "RMS/peak" = 0
              "Attack time (ms)" = 50
              "Release time (ms)" = 300
              "Threshold level (dB)" = -12
              "Ratio (1:n)" = 4
              "Knee radius (dB)" = 3
              "Makeup gain (dB)" = 5
            }
          }
          {
            type = ladspa
            name = limiter
            plugin = fast_lookahead_limiter_1913
            label = fastLookaheadLimiter
            control = { "Input gain (dB)" = 0 "Limit (dB)" = -1 "Release time (s)" = 0.8 }
          }
        ]
        links = [
          { output = "preamp:Output" input = "compressor:Left input" }
          { output = "compressor:Left output" input = "limiter:Input 1" }
        ]
        inputs = [ "preamp:Input" ]
        outputs = [ "limiter:Output 1" ]
      }
      capture.props = {
        node.name = "effect_input.t2-mic"
        audio.position = [AUX0]
        stream.dont-remix = true
        node.target = "alsa_input.pci-0000_04_00.3.HiFi__Mic__source"
        node.passive = true
      }
      playback.props = {
        node.name = "effect_output.t2-mic"
        media.class = Audio/Source
        node.passive = true
        audio.position = [MONO]
      }
    }
  }
]
