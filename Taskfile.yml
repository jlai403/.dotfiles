version: '3'

vars:
  DOTS_DIR: "{{.ROOT_DIR}}"
  ANTIGRAVITY_SRC: "{{.HOME}}/Library/Application Support/Antigravity/User"
  ANTIGRAVITY_CLI: "{{.HOME}}/.antigravity/antigravity/bin/antigravity"
  # Zen's profile dir and our backup dir differ per OS.
  ZEN_BASE:
    sh: |
      case "$(uname -s)" in
        Darwin*) echo "$HOME/Library/Application Support/zen" ;;
        *) echo "$HOME/.config/zen" ;;
      esac
  ZEN_BACKUPS_DIR:
    sh: |
      case "$(uname -s)" in
        Darwin*) echo "macos" ;;
        *) echo "omarchy" ;;
      esac

tasks:
  antigravity:backup:
    desc: Back up Antigravity settings, keybindings, and extensions to dotfiles
    cmds:
      - mkdir -p "{{.DOTS_DIR}}/macos/backups/antigravity"
      - cp "{{.ANTIGRAVITY_SRC}}/keybindings.json" "{{.DOTS_DIR}}/macos/backups/antigravity/keybindings.json"
      - echo "Backed up keybindings.json"
      - |
        python3 -c "
        import re, sys
        content = sys.stdin.read()
        content = re.sub(r'(?m)^\s*//.*\n', '', content)
        content = re.sub(r',(\s*[}\]])', r'\1', content)
        print(content)
        " < "{{.ANTIGRAVITY_SRC}}/settings.json" \
          | jq 'del(.["mssql.connections"], .["mssql.connectionGroups"])' \
          > "{{.DOTS_DIR}}/macos/backups/antigravity/settings.json"
      - echo "Backed up settings.json (SQL connections stripped)"
      - "{{.ANTIGRAVITY_CLI}} --list-extensions 2>/dev/null > {{.DOTS_DIR}}/macos/backups/antigravity/extensions.txt"
      - echo "Backed up extensions.txt"

  antigravity:restore:
    desc: Restore Antigravity settings, keybindings, and extensions from dotfiles
    cmds:
      - mkdir -p "{{.ANTIGRAVITY_SRC}}"
      - |
        for f in settings.json keybindings.json; do
          if [ ! -f "{{.DOTS_DIR}}/macos/backups/antigravity/$f" ]; then
            echo "Skipping $f — not found in dotfiles"
            continue
          fi
          cp "{{.DOTS_DIR}}/macos/backups/antigravity/$f" "{{.ANTIGRAVITY_SRC}}/$f"
          echo "Restored $f"
        done
      - |
        if [ -f "{{.DOTS_DIR}}/macos/backups/antigravity/extensions.txt" ]; then
          args=()
          while IFS= read -r ext; do
            args+=(--install-extension "$ext")
          done < "{{.DOTS_DIR}}/macos/backups/antigravity/extensions.txt"
          "{{.ANTIGRAVITY_CLI}}" "${args[@]}" --force || true
          echo "Restored extensions"
        fi

  zen:backup:
    desc: Back up Zen browser config to dotfiles (session store → private repo)
    vars:
      ZEN_PROFILE:
        sh: awk -F= '/^\[Install/{f=1} f && /^Default=/{print $2; exit}' "{{.ZEN_BASE}}/profiles.ini"
    cmds:
      - mkdir -p "{{.DOTS_DIR}}/{{.ZEN_BACKUPS_DIR}}/backups/zen"
      - |
        for f in zen-keyboard-shortcuts.json customKeys.json zen-themes.json containers.json; do
          cp "{{.ZEN_BASE}}/{{.ZEN_PROFILE}}/$f" "{{.DOTS_DIR}}/{{.ZEN_BACKUPS_DIR}}/backups/zen/$f" && echo "Backed up $f" || echo "Failed to back up $f"
        done
      - |
        # zen-sessions.jsonlz4 holds spaces AND tab URLs — this repo is public,
        # so it goes to the private companion repo instead.
        if [ ! -f "{{.ZEN_BASE}}/{{.ZEN_PROFILE}}/zen-sessions.jsonlz4" ]; then
          echo "Skipping zen-sessions.jsonlz4 — not found in profile"
        elif [ ! -d "{{.HOME}}/.dotfiles_private/.git" ]; then
          echo "Skipping zen-sessions.jsonlz4 — ~/.dotfiles_private not found"
        else
          dest="{{.HOME}}/.dotfiles_private/backups/zen/{{.ZEN_BACKUPS_DIR}}"
          mkdir -p "$dest"
          cp "{{.ZEN_BASE}}/{{.ZEN_PROFILE}}/zen-sessions.jsonlz4" "$dest/zen-sessions.jsonlz4" \
            && echo "Backed up zen-sessions.jsonlz4 (spaces + tabs) → $dest"
        fi

  doll:backup:
    desc: Back up Doll app preferences to dotfiles
    cmds:
      - mkdir -p "{{.DOTS_DIR}}/macos/backups/doll"
      - defaults export com.xiaogd.Doll "{{.DOTS_DIR}}/macos/backups/doll/com.xiaogd.Doll.plist"
      - echo "Backed up com.xiaogd.Doll.plist"

  doll:restore:
    desc: Restore Doll app preferences from dotfiles
    cmds:
      - defaults import com.xiaogd.Doll "{{.DOTS_DIR}}/macos/backups/doll/com.xiaogd.Doll.plist"
      - echo "Restored com.xiaogd.Doll.plist"

  skills:update:
    desc: Reinstall all skills via the jlai.ca/skills installer
    cmds:
      - bash -c 'bash <(curl -fsSL https://jlai.ca/skills)'
      - echo "Skills updated"

  1password:backup:
    desc: Back up the 1Password allowed-browsers list from /etc to dotfiles
    cmds:
      - mkdir -p "{{.DOTS_DIR}}/omarchy/backups/1password"
      - sudo cp /etc/1password/custom_allowed_browsers "{{.DOTS_DIR}}/omarchy/backups/1password/custom_allowed_browsers"
      - echo "Backed up custom_allowed_browsers"

  1password:restore:
    desc: Restore the 1Password allowed-browsers list to /etc (needed for the Zen browser desktop integration)
    cmds:
      - sudo install -Dm644 "{{.DOTS_DIR}}/omarchy/backups/1password/custom_allowed_browsers" /etc/1password/custom_allowed_browsers
      - echo "Restored custom_allowed_browsers"

  keyd:restore:
    desc: Stow the keyd hyper-key config into /etc and enable the service
    cmds:
      - sudo stow -d "{{.DOTS_DIR}}/omarchy" -t / keyd
      - sudo systemctl enable --now keyd
      - echo "keyd installed — hold CapsLock = Hyper (C-M-A), tap = Esc"

  dgpu:status:
    desc: Show the AMD dGPU state (parked off the bus, or on the bus driverless)
    cmds:
      - lspci -nnk -d 1002:7340 2>/dev/null || echo "dGPU parked (removed from the PCIe bus)"
      - systemctl is-active t2-dgpu-park.service || true
      - lsmod | grep amdgpu || echo "amdgpu not loaded"

  dgpu:off:
    desc: Unbind the AMD dGPU and park it off the PCIe bus now; fixes a wedged GPU without power-cycling
    cmds:
      - sudo sh -c 'for d in /sys/bus/pci/drivers/amdgpu/*:*:*.*; do [ -e "$d" ] || continue; echo -n "$d" > /sys/bus/pci/drivers/amdgpu/unbind; done; echo "dGPU unbound"'
      - sudo systemctl start t2-dgpu-park.service 2>/dev/null || true

  dgpu:on:
    desc: Park the dGPU service aside, rescan the bus and bind amdgpu (external displays live again — suspend-wedge risk until reboot; re-park with task dgpu:off)
    cmds:
      - sudo systemctl stop t2-dgpu-park.service 2>/dev/null || true
      - sudo sh -c '[ -d /sys/bus/pci/devices/0000:03:00.0 ] || echo 1 > /sys/bus/pci/rescan'
      - sudo modprobe amdgpu

  face:setup:
    desc: Install and configure facelock face unlock (sudo, polkit, lock screen)
    cmds:
      - "{{.DOTS_DIR}}/omarchy/face-unlock/setup.zsh"

  face:remove:
    desc: Remove facelock face unlock and its PAM wiring
    cmds:
      - "{{.DOTS_DIR}}/omarchy/face-unlock/remove.zsh"

  zen:restore:
    desc: Restore Zen browser config from dotfiles (requires Zen quit; snapshots live state first)
    vars:
      ZEN_PROFILE:
        sh: awk -F= '/^\[Install/{f=1} f && /^Default=/{print $2; exit}' "{{.ZEN_BASE}}/profiles.ini"
    cmds:
      - |
        if pgrep -x zen-bin >/dev/null || pgrep -x zen >/dev/null; then
          echo "Zen is running — quit it first (it rewrites these files on exit and will stomp the restore)"
          exit 1
        fi
      - mkdir -p "{{.ZEN_BASE}}/{{.ZEN_PROFILE}}"
      - |
        # Safety snapshot of the live state — a restore must always be reversible.
        ts=$(date +%Y%m%d-%H%M%S)
        snap="{{.DOTS_DIR}}/.stow-state/backups/$ts/zen"
        mkdir -p "$snap"
        for f in zen-keyboard-shortcuts.json customKeys.json zen-themes.json containers.json zen-sessions.jsonlz4; do
          [ -f "{{.ZEN_BASE}}/{{.ZEN_PROFILE}}/$f" ] && cp "{{.ZEN_BASE}}/{{.ZEN_PROFILE}}/$f" "$snap/$f"
        done
        echo "Live state snapshotted → $snap (copy those back to revert)"
      - |
        for f in zen-keyboard-shortcuts.json customKeys.json zen-themes.json containers.json; do
          if [ ! -f "{{.DOTS_DIR}}/{{.ZEN_BACKUPS_DIR}}/backups/zen/$f" ]; then
            echo "Skipping $f — not found in dotfiles"
            continue
          fi
          cp "{{.DOTS_DIR}}/{{.ZEN_BACKUPS_DIR}}/backups/zen/$f" "{{.ZEN_BASE}}/{{.ZEN_PROFILE}}/$f"
          echo "Restored $f"
        done
        sess="{{.HOME}}/.dotfiles_private/backups/zen/{{.ZEN_BACKUPS_DIR}}/zen-sessions.jsonlz4"
        if [ -f "$sess" ]; then
          cp "$sess" "{{.ZEN_BASE}}/{{.ZEN_PROFILE}}/zen-sessions.jsonlz4"
          echo "Restored zen-sessions.jsonlz4 (spaces + tabs) from ~/.dotfiles_private"
        else
          echo "Left zen-sessions.jsonlz4 untouched — no snapshot in ~/.dotfiles_private"
        fi
